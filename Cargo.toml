[package]
name = "forge"
version = "1.1.0"
edition = "2024"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
pulldown-cmark = "0.13"
regex = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
sha2 = "0.10.9"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
uuid = { version = "1.20.0", features = ["serde", "v4", "v5"] }
jsonschema = { version = "0.41.0", default-features = false }
quick-xml = { version = "0.37", features = ["serialize"] }
rayon = "1"
tempfile = "3.25.0"
pdf-extract = "0.10.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }

[lints.clippy]
all = "warn"
pedantic = "warn"

[lints.rust]
unsafe_code = "warn"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
insta = { version = "1.46.3", features = ["json"] }
proptest = "1"

[[bench]]
name = "atomize"
harness = false

[[bench]]
name = "uuid_benchmark"
harness = false

[[bench]]
name = "pipeline_benchmark"
harness = false

[[bench]]
name = "xml_benchmark"
harness = false

[[bench]]
name = "export_bench"
harness = false

[[bench]]
name = "parameter_extraction"
harness = false
