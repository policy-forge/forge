[package]
name = "forge"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
pulldown-cmark = "0.13"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.18"
tracing = "0.1.44"
uuid = { version = "1.20.0", features = ["v5"] }

[lints.clippy]
all = "warn"
pedantic = "warn"

[lints.rust]
unsafe_code = "warn"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3.25.0"

[[bench]]
name = "uuid_benchmark"
harness = false
