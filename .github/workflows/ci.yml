name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --locked --verbose

      # PRD-062 contract drift gate (see docs/adr/0001-openapi-contract-ownership.md):
      # validates the normative OpenAPI 3.1 document, forge.workspace/1 schema,
      # fixture suite, and capability-matrix coverage offline on every platform.
      - name: API contract validation
        run: cargo test --locked --test api_contract_validation --verbose


      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build release
        run: cargo build --locked --release --verbose

      - name: Maintained local client conformance
        shell: bash
        run: |
          interpreter=python3
          if [ "${{ runner.os }}" = "Windows" ]; then interpreter=python; fi
          "$interpreter" scripts/test_workspace_client.py --forge target/release/forge${{ runner.os == 'Windows' && '.exe' || '' }}

      # Heavy tooling only on Ubuntu (avoids macOS/Windows timeout and tool availability issues)
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check

      - name: Run benchmarks
        if: matrix.os == 'ubuntu-latest'
        run: cargo bench --bench pipeline_benchmark


  # Audits run in a dedicated job so a test/lint/build failure in `test`
  # cannot silently skip advisory, license, and supply-chain checks (F1062).
  audit:
    name: Supply-chain audits
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable


      # Tool binaries are independent of this project's dependency graph, so cache
      # them by the workflow definition rather than Cargo.lock.
      - name: Cache audit tooling
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-audit-tools-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --force

      - name: Security audit
        run: cargo audit

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --force

      - name: License and advisory check
        run: cargo deny check

      - name: Install cargo-vet
        run: cargo install cargo-vet --locked --force

      - name: Supply-chain audit
        run: cargo vet --locked

  dependency-fixtures:
    name: Dependency fixtures (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Offline inventory and proof fixtures
        run: python -B scripts/test_dependency_inventory.py

  dependency-inventory:
    name: Dependency inventory gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install metadata preparation toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      # This is an explicit preparation step. The subsequent inventory consumer
      # does not invoke Cargo, read its cache, download data, or refresh evidence.
      - name: Fetch exact locked manifests for graph qualification
        run: cargo fetch --locked
      - name: Independently qualify committed graph
        run: python -B scripts/dependency_graph.py check > "$RUNNER_TEMP/dependency-graph-check.json"
      - name: Offline dependency policy gate
        if: always()
        shell: bash
        run: |
          as_of="$(date -u +%F)"
          python -B scripts/dependency_inventory.py gate --as-of "$as_of" > "$RUNNER_TEMP/dependency-inventory.json"
      - name: Publish dependency report even when policy requires action
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-inventory
          path: |
            ${{ runner.temp }}/dependency-inventory.json
            ${{ runner.temp }}/dependency-graph-check.json
          if-no-files-found: error
          retention-days: 30
