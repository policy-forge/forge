name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: clippy

      - name: Cache cargo registry and build
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --verbose

      - name: Lint
        run: cargo clippy -- -D warnings

      - name: Build release
        run: cargo build --release --verbose

      # Heavy tooling only on Ubuntu (avoids macOS/Windows timeout and tool availability issues)
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check

      - name: Run benchmarks
        if: matrix.os == 'ubuntu-latest'
        run: cargo bench --bench pipeline_benchmark -- --warm-up-time 1 --measurement-time 3

      - name: Install cargo-audit
        if: matrix.os == 'ubuntu-latest'
        run: cargo install cargo-audit --locked

      - name: Security audit
        if: matrix.os == 'ubuntu-latest'
        run: cargo audit

      - name: Install cargo-deny
        if: matrix.os == 'ubuntu-latest'
        run: cargo install cargo-deny --locked

      - name: License and advisory check
        if: matrix.os == 'ubuntu-latest'
        run: cargo deny check

      - name: Install cargo-vet
        if: matrix.os == 'ubuntu-latest'
        run: cargo install cargo-vet --locked

      - name: Supply-chain audit
        if: matrix.os == 'ubuntu-latest'
        run: cargo vet --locked
