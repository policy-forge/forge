name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: clippy

      - name: Cache cargo registry and build
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7  # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --verbose


      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release
        run: cargo build --release --verbose

      # Heavy tooling only on Ubuntu (avoids macOS/Windows timeout and tool availability issues)
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check

      - name: Run benchmarks
        if: matrix.os == 'ubuntu-latest'
        run: cargo bench --bench pipeline_benchmark


  # Audits run in a dedicated job so a test/lint/build failure in `test`
  # cannot silently skip advisory, license, and supply-chain checks (F1062).
  audit:
    name: Supply-chain audits
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable


      # Tool binaries are independent of this project's dependency graph, so cache
      # them by the workflow definition rather than Cargo.lock.
      - name: Cache audit tooling
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7  # v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-audit-tools-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --force

      - name: Security audit
        run: cargo audit

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --force

      - name: License and advisory check
        run: cargo deny check

      - name: Install cargo-vet
        run: cargo install cargo-vet --locked --force

      - name: Supply-chain audit
        run: cargo vet --locked
