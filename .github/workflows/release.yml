name: Release

on:
  push:
    tags:
      - "v*"

# Restrict top-level permissions; each job declares only what it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: cargo build --release --target "$BUILD_TARGET"

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        env:
          BUILD_TARGET: ${{ matrix.target }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cd "target/${BUILD_TARGET}/release"
          tar czf "../../../forge-${TAG_NAME}-${BUILD_TARGET}.tar.gz" forge
          cd ../../..

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        env:
          BUILD_TARGET: ${{ matrix.target }}
          TAG_NAME: ${{ github.ref_name }}
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${env:BUILD_TARGET}/release/forge.exe" -DestinationPath "forge-${env:TAG_NAME}-${env:BUILD_TARGET}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: forge-${{ matrix.target }}
          path: forge-*.*

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate CycloneDX SBOM
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cargo cyclonedx --format json
          mv forge.cdx.json "forge-${TAG_NAME}-sbom.cdx.json"

      - name: Upload SBOM
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: forge-sbom
          path: forge-*-sbom.cdx.json

  hash:
    name: Compute artifact hashes
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA-256 hashes
        id: hash
        run: |
          cd artifacts
          echo "hashes=$(sha256sum ./* | base64 -w0)" >> "$GITHUB_OUTPUT"

  provenance:
    name: Generate SLSA provenance
    needs: [build, sbom, hash]
    permissions:
      actions: read
      id-token: write
      contents: write
    # SLSA L3 provenance — tamper-proof build attestation.
    # https://github.com/slsa-framework/slsa-github-generator
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.hash.outputs.hashes }}"
      upload-assets: false

  release:
    name: Create Release
    needs: [build, sbom, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Download build artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Download SLSA provenance
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: multiple.intoto.jsonl
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          generate_release_notes: true
          files: artifacts/*
