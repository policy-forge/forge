      "description": "Loopback-only workspace server. The OS assigns the port at launch; clients append it (http://127.0.0.1:<port>). The exact Host value 127.0.0.1:<port> is required on every request. No other bind address, hostname, or scheme is supported.",
      "url": "http://127.0.0.1"
    }
  ],
