            "$ref": "#/components/schemas/S3MigrationRelationship"
          }
        },
        "required": [
          "relationship",
          "approved_by",
          "approved_at"
        ],
        "type": "object"
      },
      "S3MigrationRelationship": {
        "enum": [
          "successor",
          "split",
          "merge"
        ],
        "type": "string"
      },
      "S3NamedHash": {
        "additionalProperties": false,
        "properties": {
          "path": {
            "$ref": "#/components/schemas/S3DeclaredArtifactPath"
          },
          "sha256": {
            "$ref": "#/components/schemas/S3Sha256"
          }
        },
        "required": [
          "path",
          "sha256"
        ],
        "type": "object"
      },
      "S3PolicyReference": {
        "additionalProperties": false,
        "description": "A locally declared policy/version replacement; portfolio validation must resolve it uniquely.",
        "properties": {
          "policy_key": {
            "$ref": "#/components/schemas/S3LifecycleToken"
          },
          "version_key": {
            "$ref": "#/components/schemas/S3LifecycleToken"
          }
        },
        "required": [
          "policy_key",
          "version_key"
        ],
        "type": "object"
      },
      "S3RecordedDate": {
        "description": "Canonical chrono NaiveDate recorded spelling includes negative four-digit and expanded signed years; intrinsic parser validates the actual calendar. Query/as_of stays four-digit-year S3Date.",
        "maxLength": 13,
        "minLength": 10,
        "pattern": "^(?:[0-9]{4}|-[0-9]{4,6}|\\+[0-9]{5,6})-[0-9]{2}-[0-9]{2}$",
        "type": "string"
      },
      "S3RequiredAction": {
        "enum": [
          "review-applicability",
          "review-framework-removal",
          "review-control-change",
          "repair-or-approve-mapping",
          "reapprove-mapping-rationale",
          "review-applicability-decision",
          "review-identity-migration",
          "review-resource-metadata"
        ],
        "type": "string"
      },
      "S3ResourceFingerprint": {
        "additionalProperties": false,
        "allOf": [
          {
            "else": {
              "properties": {
                "resolved_catalog_resource_id": {
                  "$ref": "#/components/schemas/S3ResourceId"
                },
                "resolved_catalog_sha256": {
                  "$ref": "#/components/schemas/S3Sha256"
                }
              }
            },
            "if": {
              "properties": {
                "resource_type": {
                  "const": "catalog"
                }
              }
            },
            "then": {
              "properties": {
                "resolved_catalog_resource_id": {
                  "type": "null"
                },
                "resolved_catalog_sha256": {
                  "type": "null"
                }
              }
            }
          }
        ],
        "description": "Declared identity in inventory; computed detail confirms complete captured closure. No href is exposed.",
        "properties": {
          "document_version": {
            "$ref": "#/components/schemas/S3MetadataToken"
          },
          "oscal_version": {
            "const": "1.2.3",
            "type": "string"
          },
          "raw_sha256": {
            "$ref": "#/components/schemas/S3Sha256"
          },
          "resolved_catalog_resource_id": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/S3ResourceId"
              },
              {
                "type": "null"
              }
            ]
          },
          "resolved_catalog_sha256": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/S3Sha256"
              },
              {
                "type": "null"
              }
            ]
          },
          "resource_id": {
            "$ref": "#/components/schemas/S3ResourceId"
          },
          "resource_type": {
            "enum": [
              "catalog",
              "profile"
            ],
            "type": "string"
          },
          "root_uuid": {
            "$ref": "#/components/schemas/S3Uuid"
          }
        },
        "required": [
          "resource_id",
          "resource_type",
          "raw_sha256",
          "root_uuid",
          "document_version",
          "oscal_version",
          "resolved_catalog_sha256",
          "resolved_catalog_resource_id"
        ],
        "type": "object"
      },
      "S3ResourceId": {
        "maxLength": 84,
        "minLength": 1,
        "pattern": "^res_[0-9a-z]{12,80}$",
        "type": "string"
      },
      "S3ResourceRole": {
        "enum": [
          "policy-source",
          "oscal-catalog-artifact",
          "oscal-component-artifact",
          "mapping-collection",
          "applicability-manifest",
          "applicability-report",
          "trace-report",
          "lifecycle-record",
          "lifecycle-source",
          "oscal-profile-artifact",
          "oscal-ssp-artifact",
          "framework-impact-manifest",
          "successor-map",
          "framework-impact-report",
          "framework-impact-dispositions"
        ],
        "type": "string"
      },
      "S3RowAvailability": {
        "enum": [
          "valid",
          "invalid",
          "unavailable"
        ],
        "type": "string"
      },
      "S3Sha256": {
        "maxLength": 64,
        "minLength": 1,
        "pattern": "^[0-9a-f]{64}$",
        "type": "string"
      },
      "S3SubjectFingerprint": {
        "additionalProperties": false,
        "properties": {
          "id": {
            "$ref": "#/components/schemas/S3MetadataToken"
          },
          "sha256": {
            "$ref": "#/components/schemas/S3Sha256"
          }
        },
        "required": [
          "id",
          "sha256"
        ],
        "type": "object"
      },
      "S3Timestamp": {
        "format": "date-time",
        "maxLength": 4096,
        "minLength": 1,
        "type": "string"
      },
      "S3UnresolvedImpactReference": {
        "additionalProperties": false,
        "description": "Recorded impact identifier lacks an exact comparison pair; it is never joined to a guessed report.",
        "properties": {
          "binding": {
            "const": "unresolved",
            "type": "string"
          },
          "finding_id": {
            "$ref": "#/components/schemas/S3LifecycleToken"
          }
        },
        "required": [
          "finding_id",
          "binding"
        ],
        "type": "object"
      },
      "S3Uuid": {
        "format": "uuid",
        "maxLength": 36,
        "minLength": 1,
        "pattern": "^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$",
        "type": "string"
      },
      "S3ValidationState": {
        "enum": [
          "valid",
          "invalid",
          "stale",
          "not-validated"
        ],
        "type": "string"
      },
      "S3DeclaredFindingUuid": {
        "description": "Exact finding_id spelling admitted by uuid 1.26.1 parse_str in the declared prior/disposition path: simple, hyphenated, braced or lowercase urn:uuid prefix. Preserved verbatim, never normalized; no authenticated judgment. Computed finding IDs remain S3Uuid. No uuid format assertion is attached because some validators restrict it to hyphenated spelling.",
        "maxLength": 45,
        "minLength": 32,
        "pattern": "^(?:[0-9A-Fa-f]{32}|[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}|\\{[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}\\}|urn:uuid:[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12})$",
        "type": "string"
      }
    },
    "securitySchemes": {
      "capabilityBearer": {
        "bearerFormat": "capability",
        "description": "Memory-only, per-launch capability delivered exactly once (unlock response for browser sessions; machine-session stdout descriptor otherwise). Not an account, durable identity, role, reviewer attestation, or ambient HTTP Basic credential; never placed in URLs, cookies, browser storage, server-rendered HTML, logs, or crash output; expired on process shutdown. Scoped browser|machine x read|write and bound to session ID, project root, client mode, and scope: cross-mode use is rejected and a read-only capability is rejected on every mutation with the typed read-only-session error. Secrets are compared in constant time. Requests must also carry the exact Host 127.0.0.1:<port>.",
        "scheme": "bearer",
        "type": "http"
      }
    }
  },
  "info": {
    "description": "Normative, contract-authored OpenAPI 3.1 description of the PRD 062 local web workspace API. Normative contract ownership is independent of handler/UI implementation; this artifact is the single source of truth for /api/v2 product behavior; handlers, fixtures, generated or type-checked clients, and the bundled UI must not drift from it. Contract ownership and drift enforcement are recorded in docs/adr/0001-openapi-contract-ownership.md (authored in parallel; referenced by path only). The governed product contract is docs/PRD/062-prd-local-web-workspace.md, in particular \"Golden Path and Information Architecture\", \"Workspace, Data, and Authority Model\", \"Trust Model and Security Boundaries\", \"API-First Architecture and Shared Application-Service Boundary\", \"Write Preview and Transaction Model\", and the \"MVP API Capability Matrix\" table.\nTransport rules (normative):\n- The server binds exactly one OS-assigned port on 127.0.0.1 only;\n  never 0.0.0.0, ::, a LAN address, or the hostname localhost, with no\n  configurable host flag. Every request must carry the exact Host value\n  127.0.0.1:<assigned-port>; DNS names, alternate ports, forwarded-host\n  headers, and proxy routing are rejected generically before\n  authorization.\n- No CORS. Browser state-changing requests additionally require the\n  exact session Origin, appropriate Fetch Metadata, and a non-simple\n  JSON content type. All API and project-derived responses use no-store.\n- Static bootstrap assets (locked shell and unlock form) are served\n  outside /api/v2, may be unauthenticated, and contain no project data.\n  The machine bootstrap is a one-line sensitive JSON descriptor printed\n  on stdout by `forge workspace --project <DIR> --machine-session --api-major 2`,\n  also outside /api/v2.\n- Exactly one operation is callable without a bearer capability:\n  POST /api/v2/session/unlock. Everything else requires the scoped\n  capability described by the capabilityBearer security scheme.\n- Versioned project files on disk are authoritative. No hidden\n  database, no arbitrary path read/write endpoints, no shell or\n  subprocess endpoints, no remote fetch of any kind.\n\nCross-cutting semantics (normative, enforced per operation below):\n- Strong versioning: every mutable resource response carries an opaque\n  strong `version` (an ETag equivalent conveyed in the body). Every\n  mutation observes a version and fails with the typed version-conflict\n  error, including the current resource_version, on mismatch.\n  Last-write-wins is prohibited.\n- Idempotency: requests that create a preview, an operation, or commit\n  an effect require a client-generated Idempotency-Key header. A retry\n  with the same key and identical content returns the original preview,\n  operation, or commit result without repeating the effect; reuse of a\n  key with different content fails with idempotency-key-conflict.\n- Two-step effects: material writes happen only through a preview\n  (exact target, create/overwrite status, base/target and input hashes,\n  validation diagnostics, semantic summary, escaped text diff) followed\n  by a commit presenting a one-time receipt bound to the session,\n  operation type, destination identity, base hash, input hashes, and\n  exact-byte hash. Commits revalidate every binding.\n- Operations: bounded long-running work is a queryable Operation with a\n  stable ID, a pending|running|succeeded|failed|cancelled state machine,\n  a typed terminal result, safe cancellation, and enough state to\n  determine whether a write committed after a lost response.\n- Pagination: collections use a deterministic opaque-cursor envelope\n  (page.items, page.next_cursor, page.total_matching) with bounded page\n  size and documented stable sort and filter fields; traversal of an\n  unchanged resource version neither duplicates nor omits items.\n- Errors: a closed envelope with a stable machine-readable code, safe\n  message, optional resource/field pointers, retryability, correlation\n  id, and current resource version when relevant. Errors never contain\n  capabilities, absolute paths, raw source excerpts, or Rust debug\n  strings.\n- Read-only sessions: when the session capability is read-only, every\n  mutation returns the typed read-only-session error and no project\n  file changes.\nExplicit --api-major 2 serves only this namespace. API1 remains available by default in a separate launch. Index1/2 are independently closed; launch never migrates files. Lifecycle/impact roles grant intrinsic registration and metadata only; the later captured read services remain separately gated.",
    "license": {
      "name": "MIT"
    },
    "title": "FORGE Local Workspace API",
    "version": "2.1.0"
  },
  "jsonSchemaDialect": "https://json-schema.org/draft/2020-12/schema",
  "openapi": "3.1.0",
  "paths": {
    "/api/v2/applicability/analyses": {
      "post": {
        "description": "Runs the shared applicability analysis application service over the currently committed applicability manifest, mapping inputs, and registered framework resources. Creates a bounded Operation (kind applicability-analysis) whose terminal result carries classification counts, the eligible-control denominator, input staleness, and an EffectPreview for the regenerated report file; the report is written only after that preview is committed through commitEffectPreview. Identical retries with the same Idempotency-Key return the original operation.",
        "operationId": "analyzeApplicability",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "responses": {
          "202": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Operation"
                }
              }
            },
            "description": "Analysis operation created; identical idempotent retries return it unchanged."
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/ForbiddenReadOnly"
          },
          "422": {
            "$ref": "#/components/responses/UnprocessableValidation"
          }
        },
        "security": [
          {
            "capabilityBearer": []
          }
        ],
        "summary": "Rebuild the deterministic applicability gap analysis",
        "tags": [
          "Applicability"
        ]
      }
    },
    "/api/v2/applicability/controls": {
      "get": {
        "description": "Deterministic, cursor-paginated inventory of every eligible framework control with its current classification and explicit decision state. The complete control denominator is observable here: controls omitted from the manifest appear as under-review. Stable sort is by control_id ascending; filters are exact-match. Traversing one unchanged report version neither duplicates nor omits controls.",
        "operationId": "listApplicabilityControls",
        "parameters": [
          {
            "$ref": "#/components/parameters/Cursor"
          },
          {
            "$ref": "#/components/parameters/PageSize"
          },
          {
            "description": "Filter by gap classification.",
            "in": "query",
            "name": "classification",
            "required": false,
            "schema": {
              "$ref": "#/components/schemas/GapClassification"
            }
          },
          {
            "description": "Filter by explicit human decision state.",
            "in": "query",
            "name": "decision_state",
            "required": false,
            "schema": {
              "$ref": "#/components/schemas/DecisionState"
            }
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ControlPage"
                }
              }
            },
            "description": "One page of the control inventory."
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          }
        },
        "security": [
          {
            "capabilityBearer": []
          }
        ],
        "summary": "List the complete framework control inventory",
        "tags": [
          "Applicability"
        ]
      }
    },
    "/api/v2/applicability/draft": {
      "get": {
        "description": "Returns the on-disk forge.applicability/1 manifest as the current draft, its strong version, and a validation summary computed at read time. Returns not-found when no applicability manifest is registered yet (setup state).",
        "operationId": "getApplicabilityDraft",
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApplicabilityDraft"
                }
              }
            },
            "description": "Current applicability manifest draft."
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          }
        },
        "security": [
          {
            "capabilityBearer": []
          }
        ],
        "summary": "Read the current applicability manifest draft",
        "tags": [
          "Applicability"
        ]
      },
      "put": {
        "description": "Submits a complete proposed forge.applicability/1 document plus the observed version of the manifest being replaced. The service parses and validates the whole document through the shared domain parser and, when valid, returns an EffectPreview (operation type applicability-manifest-write) bound to the exact proposed bytes; no file changes until commitEffectPreview. A structurally invalid document returns validation-failed; use validateApplicabilityDraft for diagnostics without a preview. Idempotent retries return the original preview.",
        "operationId": "putApplicabilityDraft",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ApplicabilityDraftPutRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DraftPreviewResponse"
                }
              }
            },
            "description": "Validation outcome plus the write preview; nothing committed."
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/ForbiddenReadOnly"
          },
          "409": {
            "$ref": "#/components/responses/ConflictVersion"
          },
          "422": {
            "$ref": "#/components/responses/UnprocessableValidation"
          }
        },
        "security": [
          {
            "capabilityBearer": []
          }
        ],
        "summary": "Validate a complete proposed applicability manifest and preview its write",
        "tags": [
          "Applicability"
        ]
      }
    },
    "/api/v2/applicability/draft/validation": {
      "post": {
        "description": "Pure validation of a complete proposed forge.applicability/1 document. Returns the same structured diagnostics the put and commit paths enforce. Computes only; safe in read-only sessions and never mints a receipt.",
        "operationId": "validateApplicabilityDraft",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/DraftValidationRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ValidationReport"
                }
              }
            },
            "description": "Structured validation report."
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          }
        },
        "security": [
          {
            "capabilityBearer": []
          }
        ],
        "summary": "Validate a proposed applicability manifest without creating a preview",
        "tags": [
          "Applicability"
        ]
      }
    },
    "/api/v2/applicability/initializations": {
      "post": {
        "description": "Binds explicitly selected registered Catalog resources and their current inventories. Creates no inferred decisions or relationships. Returns a single-file preview; registration is a separate explicit operation after commit. Scope decisions and reviewers remain empty. The target must be a new unregistered file. Identical idempotent retries return the original preview. No project file is written by initialization.",
        "operationId": "initializeApplicabilityDraft",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ApplicabilityInitializationRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DraftPreviewResponse"
                }
              }
            },
            "description": "Initial manifest validation and exact-byte preview."
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/ForbiddenReadOnly"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "409": {
            "$ref": "#/components/responses/ConflictVersion"
          },
          "422": {
            "$ref": "#/components/responses/UnprocessableValidation"
          }
        },
        "security": [
          {
            "capabilityBearer": []
          }
        ],
        "summary": "Prepare an explicit initial decision manifest",
        "tags": [
          "Applicability"
        ]
      }
    },
    "/api/v2/applicability/report": {
      "get": {
        "description": "Returns the last committed gap report from disk with its version, the input fingerprints it was generated from, whether any input has changed since (stale), reconciled classification counts, and the eligible-control total. Returns not-found when no report exists yet.",
        "operationId": "getApplicabilityReport",
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ApplicabilityReportView"
                }
              }
            },
            "description": "Current applicability gap report view."
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          }
        },
        "security": [
          {
            "capabilityBearer": []
          }
        ],
        "summary": "Read the current applicability gap report",
        "tags": [
          "Applicability"
        ]
      }
    },
    "/api/v2/conversions": {
      "post": {
        "description": "Prepares Catalog or Component Definition conversion outputs for a registered policy-source resource through the shared conversion application service. Creates a bounded Operation (kind conversion); its terminal result (retrievable via getConversion) lists the derived products with an EffectPreview for the proposed output file. No output is written until commitEffectPreview. Identical retries with the same Idempotency-Key return the original operation.",
        "operationId": "preparePolicyConversion",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ConversionRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "202": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Operation"
                }
              }
            },
            "description": "Conversion operation created; identical idempotent retries return it unchanged."
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/ForbiddenReadOnly"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "422": {
            "$ref": "#/components/responses/UnprocessableValidation"
          }
        },
        "security": [
          {
            "capabilityBearer": []
          }
        ],
        "summary": "Prepare a Markdown policy conversion",
        "tags": [
          "Policy Onboarding"
        ]
      }
    },
    "/api/v2/conversions/{operation_id}": {
      "get": {
        "description": "Typed terminal view of a succeeded conversion operation: derived product summaries, structured validation diagnostics for the proposed outputs, and the EffectPreview carrying target, hashes, semantic summary, diff, and receipt. The operation_id is the ID returned by preparePolicyConversion.",
        "operationId": "getConversion",
        "parameters": [
          {
            "$ref": "#/components/parameters/OperationIdPath"
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ConversionResult"
                }
              }
            },
            "description": "Conversion products and preview."
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          }
        },
        "security": [
          {
            "capabilityBearer": []
          }
        ],
        "summary": "Inspect derived conversion products",
        "tags": [
          "Policy Onboarding"
        ]
      }
    },
    "/api/v2/effects/commits": {
      "post": {
        "description": "The only write path. Submits the one-time preview receipt, the observed resource version, and explicit confirmation intent. The service revalidates the session binding, operation type, destination identity, base hash, input hashes, and exact-byte hash; any mismatch, expiry, or reuse invalidates the receipt without a write. A valid commit creates a stable Operation (kind commit) that atomically writes only the previewed bytes and returns the committed fingerprint; after a lost response, an identical retry with the same Idempotency-Key returns the original operation and committed hash without a second write.",
        "operationId": "commitEffectPreview",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CommitEffectRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "202": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Operation"
                }
              }
            },
            "description": "Commit operation created; poll getOperation for the terminal result and committed hash."
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/ForbiddenReadOnly"
          },
          "409": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Version conflict, idempotency key reuse with different content, receipt reuse, or receipt binding mismatch. The error envelope carries resource_version on version-conflict."
          },
          "410": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "The preview receipt has expired."
          },
          "422": {
            "$ref": "#/components/responses/UnprocessableValidation"
          }
        },
        "security": [
          {
            "capabilityBearer": []
          }
        ],
        "summary": "Commit the exact previewed bytes",
        "tags": [
          "Effects"
        ]
      }
    },
