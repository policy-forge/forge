    {
      "description": "Local unlock, session metadata and API version discovery, and orderly shutdown. POST /api/v2/session/unlock is the only unauthenticated /api/v2 operation.",
      "name": "Session"
    },
    {
      "description": "Project-level summary and configuration status derived from the explicit project root and registered resources. No recursive or arbitrary scanning.",
      "name": "Project"
    },
    {
      "description": "Registered project resource inventory, inspection, registration, and bounded upload. Addresses resources by opaque registered IDs; project-relative paths appear only in authorized metadata and effect previews.",
      "name": "Resources"
    },
    {
      "description": "Markdown-to-OSCAL conversion preparation and inspection of derived products. Conversion prepares outputs through the shared conversion application service; writes happen only through the Effects pattern.",
      "name": "Policy Onboarding"
    },
    {
      "description": "Structured validation of registered resources and proposed drafts with stable codes and resource/field pointers. No terminal-output parsing.",
      "name": "Validation"
    },
    {
      "description": "PRD 056 framework scope inventory, applicability manifest draft read/validate/save, deterministic gap analysis, and the current report view. Omitted controls remain under-review; the API never infers a decision.",
      "name": "Applicability"
    },
    {
      "description": "PRD 055 mapping subject inventory, mapping manifest draft read/validate/save, collection build, and consistency checks. Preserves exact resource identity and the positive versus explicit no-relationship distinction.",
      "name": "Mapping"
    },
    {
      "description": "Stable reason-code review items with deterministic filter, sort, and pagination, plus counts that reconcile to the unfiltered denominator.",
      "name": "Review Queue"
    },
    {
      "description": "Bidirectional traversal among report items, controls, decisions, mapping edges, policy subjects, and bounded source excerpts with resource fingerprints. No arbitrary path reads.",
      "name": "Provenance"
    },
    {
      "description": "Preview retrieval (including the escaped text diff) and conditional, idempotent, exact-byte commit. Previews are created by the preview-producing operations in the Resources, Policy Onboarding, Applicability, Mapping, and Exports tags; commits are the only write path.",
      "name": "Effects"
    },
    {
      "description": "Queryable operation lifecycle: status, typed terminal result, and safe cancellation for bounded work started by conversion, analysis, build, export, and commit requests.",
      "name": "Operations"
    },
    {
      "description": "Self-contained, redacted static report export preparation and download. No remote publish.",
      "name": "Exports"
    },
    {
      "name": "Lifecycle",
      "description": "Read-only captured metadata with explicit dates, complete counts and bound provenance. Recorded actors and dispositions are asserted metadata, not authenticated human approval."
    },
    {
