    "/api/v2/lifecycle/records": {
      "get": {
        "operationId": "getLifecycleRecords",
        "summary": "getLifecycleRecords",
        "description": "Use one complete immutable registration capture and its preflighted dependency closure. No unregistered reads, effect store or project mutation. One 10-second admission deadline includes blocking-worker wait, capture, domain work and response validation/encoding. Responses are at most 4 MiB, with pages of 1\u2013200 items, complete counts and no hidden prefix. Cursors bind endpoint, selected resource, explicit date, filters, page size and capture; changed inputs return version-conflict. Source excerpts, titles, rationale, party names, private paths and credentials are excluded; declared owner/actor keys and hashes remain sensitive metadata. Detail and owner queue require an explicit date. Inventory without a date and recorded history do not assert current freshness. Computed status validates the complete portfolio and captured artifacts.",
        "tags": [
          "Lifecycle"
        ],
        "security": [
          {
            "capabilityBearer": []
          }
        ],
        "parameters": [
          {
            "name": "as_of",
            "in": "query",
            "required": false,
            "description": "Explicit real calendar date, YYYY-MM-DD; no implicit clock is sampled. Invalid calendar dates fail before capture.",
            "schema": {
              "type": "string",
              "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
              "minLength": 10,
              "maxLength": 10
            }
          },
          {
            "name": "owner",
            "in": "query",
            "required": false,
            "description": "Exact trimmed declared metadata token, at most 4096 UTF8 bytes, without control characters; combined with other filters using AND semantics. Schema character bounds do not replace runtime byte admission.",
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 4096
            }
          },
          {
            "name": "state",
            "in": "query",
            "required": false,
            "description": "Exact recorded lifecycle state.",
            "schema": {
              "type": "string",
              "enum": [
                "draft",
                "in-review",
                "approved",
                "superseded",
                "retired"
              ]
            }
          },
          {
            "$ref": "#/components/parameters/PageSize"
          },
          {
            "$ref": "#/components/parameters/ReadCursor"
          }
        ],
        "responses": {
          "200": {
            "description": "Complete bounded captured result.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LifecycleRecordPage"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/ContainedReferenceRejected"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "409": {
            "$ref": "#/components/responses/ConflictVersion"
          },
          "413": {
            "$ref": "#/components/responses/PayloadTooLarge"
          },
          "422": {
