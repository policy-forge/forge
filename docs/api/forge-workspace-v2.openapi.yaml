    "/api/v2/session/unlock": {
      "post": {
        "description": "The only /api/v2 operation callable without a bearer capability. Accepts the per-launch passphrase over the exact loopback origin; verification uses Argon2id with a per-launch salt. Failures are generic and indistinguishable, with bounded increasing delay after failures. On success, mints and returns once a distinct browser-scoped, memory-only capability; a second browser context must unlock separately and receives a different capability. Neither the response nor failures reveal project state, the passphrase, or its hash.",
