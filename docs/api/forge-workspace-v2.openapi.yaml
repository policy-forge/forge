          "required": true
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SessionUnlockResponse"
                }
              }
            },
            "description": "Unlock succeeded; the capability is returned exactly once and must be retained only in page memory."
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Generic unlock failure (wrong or malformed passphrase). Indistinguishable for any wrong value; no project-state disclosure."
          },
          "429": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Unlock throttled after repeated failures; retry after the documented bounded delay."
          }
        },
        "security": [],
        "summary": "Unlock a browser session with the per-launch passphrase",
        "tags": [
          "Session"
        ]
      }
    },
