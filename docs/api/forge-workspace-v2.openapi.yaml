        "description": "Explicit index2 metadata-only bundle paired only with forge.workspace/2. Original index1 interpretation is preserved separately. Intrinsic runtime checks retain ordered pin bijection, normalized Index::bytes hash and checked aggregate <=50MiB. Metadata can be sensitive; no source content or authority.",
        "properties": {
