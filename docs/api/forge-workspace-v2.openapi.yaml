      "WorkspaceBundleIndexV2": {
        "title": "FORGE workspace resource index (forge.workspace/2)",
        "description": "Closed, versioned schema for the optional forge.workspace.json project resource index consumed by the PRD 062 local web workspace. The file is an index of explicitly registered, supported FORGE resources: it is an index, not a database and not a domain authority. Domain manifests and OSCAL artifacts retain their own provenance contracts; current hashes and validation state are computed at read time and are never stored here. The index must not contain launch tokens, secrets, absolute paths, reviewer credentials, cached source text, UI layout, approval state, or inferred relationships; the closed property set below enforces that by construction.",
        "$comment": "The authoritative schema_version constant forge.workspace/2 lives in this schema. Runtime retains independent forge.workspace/1 admission; duplicates, portable aliases, self-reference and root confinement remain intrinsic/runtime checks.",
        "type": "object",
        "additionalProperties": false,
        "required": [
          "schema_version",
          "label",
          "resources"
        ],
        "properties": {
          "schema_version": {
            "const": "forge.workspace/2",
            "description": "Fixed schema identifier for this index format."
          },
          "label": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200,
            "description": "Human-readable project label used for display only. Not a path and not an identity claim."
          },
          "resources": {
            "type": "array",
            "minItems": 0,
            "maxItems": 1000,
            "description": "Ordered list of explicitly registered supported resources. Array order is the authorial display order and is preserved on write. Keys must be unique across the list (enforced by the parser; see $comment).",
            "items": {
              "$ref": "#/components/schemas/WorkspaceBundleIndexResourceV2"
            }
          }
        }
      },
      "WorkspaceBundleIndexResourceV2": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "key",
          "role",
          "path"
        ],
        "properties": {
          "key": {
            "type": "string",
            "pattern": "^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$",
            "description": "Stable local key (1-64 characters, lowercase alphanumeric with interior hyphens, no leading or trailing hyphen), unique within the index, used by API resource metadata and effect previews."
          },
          "role": {
            "$ref": "#/components/schemas/WorkspaceBundleIndexRoleV2"
          },
          "path": {
            "type": "string",
            "minLength": 1,
            "maxLength": 512,
            "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]*(/[A-Za-z0-9][A-Za-z0-9._-]*)*$",
            "description": "Project-relative POSIX-style path. Every segment must begin with an alphanumeric character, which rejects absolute paths (leading '/'), parent or current directory traversal ('..', '.'), Windows drive prefixes ('C:\\', 'C:/'), backslashes, and leading-dot hidden files. Symlinks and non-regular files are rejected by the runtime, not by this pattern."
          }
        }
      },
      "WorkspaceBundleIndexRoleV2": {
        "type": "string",
        "enum": [
          "policy-source",
          "oscal-catalog-artifact",
          "oscal-component-artifact",
          "mapping-collection",
          "applicability-manifest",
          "applicability-report",
          "trace-report",
          "lifecycle-record",
          "lifecycle-source",
          "oscal-profile-artifact",
          "oscal-ssp-artifact",
          "framework-impact-manifest",
          "successor-map",
          "framework-impact-report",
          "framework-impact-dispositions"
        ],
        "description": "Closed explicit /2 role set. Legacy /1 retains its original seven roles. New lifecycle and framework-impact inputs remain domain-authorial files, not inferred approval or current computed state. lifecycle-source is opaque hash-only bytes; framework-impact-report uses limited prior-report admission, not a full report/freshness/native OSCAL schema claim. Adding another role requires another index schema version."
      },
      "WorkspaceIndexBundleV1": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "schema_version",
          "content_profile",
          "index",
          "index_sha256",
          "pins"
        ],
        "description": "Metadata-only index bundle, bounded to 1 MiB encoded. Runtime additionally enforces exact ordered pin bijection, normalized index hash, portable path uniqueness and checked aggregate declared bytes <=50 MiB including normalized index bytes. Label/key/path/hash metadata can be sensitive correlation information. No content, credentials, timestamps, cached validation or approval claims.",
        "properties": {
          "schema_version": {
            "type": "string",
            "const": "forge.workspace-index-bundle/1"
          },
          "content_profile": {
            "type": "string",
            "const": "index-and-hashes"
          },
          "index": {
            "$ref": "#/components/schemas/WorkspaceBundleIndex"
          },
          "index_sha256": {
            "$ref": "#/components/schemas/Sha256Hex",
            "description": "SHA256 of normalized Index::bytes encoding including its final newline; not the original index-file formatting or JCS."
          },
          "pins": {
            "type": "array",
            "maxItems": 1000,
            "items": {
              "$ref": "#/components/schemas/WorkspaceIndexBundlePin"
            }
          }
        }
      },
