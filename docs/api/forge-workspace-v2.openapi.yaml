{
  "components": {
    "parameters": {
      "Cursor": {
        "description": "Opaque deterministic cursor from a previous page.next_cursor; stable only for an unchanged underlying resource version.",
        "in": "query",
        "name": "cursor",
        "required": false,
        "schema": {
          "maxLength": 512,
          "minLength": 1,
          "type": "string"
        }
      },
      "ExcerptIdPath": {
        "description": "Opaque bounded excerpt identifier.",
        "in": "path",
        "name": "excerpt_id",
        "required": true,
        "schema": {
          "pattern": "^ex_[0-9a-z]{12,80}$",
          "type": "string"
        }
      },
      "IdempotencyKey": {
        "description": "Client-generated key for effect-creating requests (preview, operation, or commit creation). Same key with identical content returns the original result; same key with different content fails with idempotency-key-conflict.",
        "in": "header",
        "name": "Idempotency-Key",
        "required": true,
        "schema": {
          "maxLength": 255,
          "minLength": 16,
          "type": "string"
        }
      },
      "OperationIdPath": {
        "description": "Stable operation identifier.",
        "in": "path",
        "name": "operation_id",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/OperationId"
        }
      },
      "PageSize": {
        "description": "Maximum number of items returned in one page (1-200, default 50).",
        "in": "query",
        "name": "page_size",
        "required": false,
        "schema": {
          "default": 50,
          "maximum": 200,
          "minimum": 1,
          "type": "integer"
        }
      },
      "PreviewIdPath": {
        "description": "Opaque effect preview identifier.",
        "in": "path",
        "name": "preview_id",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/PreviewId"
        }
      },
      "ResourceIdPath": {
        "description": "Opaque registered resource identifier.",
        "in": "path",
        "name": "resource_id",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/ResourceId"
        }
      },
      "ReadCursor": {
        "description": "Opaque cursor bound to the captured version, endpoint, selected resource, exact date/filter tuple and page size.",
        "in": "query",
        "name": "cursor",
        "required": false,
        "schema": {
          "type": "string",
          "minLength": 1,
          "maxLength": 256
        }
      }
    },
    "responses": {
      "BadRequest": {
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        },
        "description": "Malformed request (invalid JSON, duplicate object keys, wrong content type, invalid query parameters, or structural bound violations)."
      },
      "ConflictVersion": {
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        },
        "description": "The observed version does not match the current resource version (version-conflict); the error carries resource_version with the current value. Alternatively an idempotency-key or receipt conflict (see the Error code)."
      },
      "ForbiddenReadOnly": {
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        },
        "description": "The session capability is read-only; the operation is a mutation. No project file changes."
      },
      "NotFound": {
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        },
        "description": "The addressed resource or operation does not exist in this session."
      },
      "PayloadTooLarge": {
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        },
        "description": "The uploaded content exceeds the documented bounded size."
      },
      "Unauthorized": {
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        },
        "description": "Missing, malformed, or wrong capability, or a rejected Host, Origin, or Fetch Metadata context. Generic rejection with no project-state disclosure."
      },
      "UnprocessableValidation": {
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        },
        "description": "The submitted document or content failed domain validation; the error is typed and safe. Fetch full diagnostics through the validation operations."
      },
      "QueryInterrupted": {
        "description": "The read stopped before a complete response. A query-budget-exceeded or query-interrupted error returns no partial result. Checkpoints are cooperative and do not preempt an internal parser or syscall.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "ContainedReferenceRejected": {
        "description": "A captured dependency cannot be resolved safely to an explicitly registered resource of an admitted role. No unregistered path is opened.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      }
    },
    "schemas": {
      "AnalysisResult": {
        "additionalProperties": false,
        "description": "Typed terminal result of a succeeded applicability-analysis operation.",
        "properties": {
          "classification_counts": {
            "description": "Reconciled classification totals.",
            "items": {
              "additionalProperties": false,
              "properties": {
                "classification": {
                  "$ref": "#/components/schemas/GapClassification"
                },
                "count": {
                  "minimum": 0,
                  "type": "integer"
                }
              },
              "required": [
                "classification",
                "count"
              ],
              "type": "object"
            },
            "maxItems": 6,
            "minItems": 0,
            "type": "array"
          },
          "eligible_controls": {
            "description": "Complete denominator of eligible framework controls.",
            "minimum": 0,
            "type": "integer"
          },
          "report_preview": {
            "$ref": "#/components/schemas/EffectPreview"
          },
          "stale_inputs": {
            "description": "Whether any analysis input changed since the last committed report.",
            "type": "boolean"
          }
        },
        "required": [
          "classification_counts",
          "eligible_controls",
          "stale_inputs",
          "report_preview"
        ],
        "type": "object"
      },
      "ApplicabilityDraft": {
        "additionalProperties": false,
        "description": "Current applicability manifest draft read from disk.",
        "properties": {
          "manifest": {
            "description": "Complete forge.applicability/1 document exactly as stored on disk. Validated by the shared domain parser (snake_case fields, closed contract, duplicate-key rejection); the API does not redefine the domain schema.",
            "type": "object"
          },
          "validation_summary": {
            "$ref": "#/components/schemas/DiagnosticSummary"
          },
          "version": {
            "$ref": "#/components/schemas/ResourceVersion"
          }
        },
        "required": [
          "version",
          "manifest",
          "validation_summary"
        ],
        "type": "object"
      },
      "ApplicabilityDraftPutRequest": {
        "additionalProperties": false,
        "properties": {
          "manifest": {
            "description": "Complete proposed forge.applicability/1 document.",
            "type": "object"
          },
          "observed_version": {
            "$ref": "#/components/schemas/ResourceVersion"
          }
        },
        "required": [
          "manifest",
          "observed_version"
        ],
        "type": "object"
      },
      "ApplicabilityInitializationRequest": {
        "additionalProperties": false,
        "properties": {
          "framework_resource_id": {
            "$ref": "#/components/schemas/ResourceId"
          },
          "target_path": {
            "$ref": "#/components/schemas/ProjectRelativePath"
          }
        },
        "required": [
          "framework_resource_id",
          "target_path"
        ],
        "type": "object"
      },
      "ApplicabilityReportView": {
        "additionalProperties": false,
        "description": "Current committed applicability gap report view.",
        "properties": {
          "classification_counts": {
            "items": {
              "additionalProperties": false,
              "properties": {
                "classification": {
                  "$ref": "#/components/schemas/GapClassification"
                },
                "count": {
                  "minimum": 0,
                  "type": "integer"
                }
              },
              "required": [
                "classification",
                "count"
              ],
              "type": "object"
            },
            "maxItems": 6,
            "minItems": 0,
            "type": "array"
          },
          "eligible_controls": {
            "minimum": 0,
            "type": "integer"
          },
          "input_fingerprints": {
            "items": {
              "additionalProperties": false,
              "properties": {
                "matches_current": {
                  "type": "boolean"
                },
                "resource_id": {
                  "$ref": "#/components/schemas/ResourceId"
                },
                "sha256": {
                  "$ref": "#/components/schemas/Sha256Hex"
                }
              },
              "required": [
                "resource_id",
                "sha256",
                "matches_current"
              ],
              "type": "object"
            },
            "maxItems": 100,
            "minItems": 0,
            "type": "array"
          },
          "stale": {
            "description": "Whether any input fingerprint no longer matches the registered resource content.",
            "type": "boolean"
          },
          "version": {
            "$ref": "#/components/schemas/ResourceVersion"
          }
        },
        "required": [
          "version",
          "stale",
          "input_fingerprints",
          "classification_counts",
          "eligible_controls"
        ],
        "type": "object"
      },
      "CommitEffectRequest": {
        "additionalProperties": false,
        "description": "Confirmation submits only the one-time receipt token, the observed resource version, and explicit confirmation intent, plus the Idempotency-Key header.",
        "properties": {
          "confirmed": {
            "description": "Must be the literal true; absent or false is rejected.",
            "enum": [
              true
            ],
            "type": "boolean"
          },
          "observed_version": {
            "$ref": "#/components/schemas/ResourceVersion"
          },
          "receipt": {
            "description": "One-time preview receipt token.",
            "maxLength": 512,
            "minLength": 16,
            "type": "string"
          }
        },
        "required": [
          "receipt",
          "observed_version",
          "confirmed"
        ],
        "type": "object"
      },
      "CommitResult": {
        "additionalProperties": false,
        "description": "Typed terminal result of a succeeded commit operation.",
        "properties": {
          "committed_sha256": {
            "$ref": "#/components/schemas/Sha256Hex"
          },
          "new_version": {
            "$ref": "#/components/schemas/ResourceVersion"
          },
          "target_path": {
            "$ref": "#/components/schemas/ProjectRelativePath"
          },
          "write_committed": {
            "description": "The exact previewed bytes were atomically written.",
            "enum": [
              true
            ],
            "type": "boolean"
          }
        },
        "required": [
          "write_committed",
          "committed_sha256",
          "target_path",
          "new_version"
        ],
        "type": "object"
      },
      "ControlInventoryItem": {
        "additionalProperties": false,
        "properties": {
          "classification": {
            "$ref": "#/components/schemas/GapClassification"
          },
          "control_id": {
            "description": "Stable framework control identifier.",
            "maxLength": 200,
            "minLength": 1,
            "type": "string"
          },
          "decision_state": {
            "$ref": "#/components/schemas/DecisionState"
          },
          "has_positive_mapping": {
            "type": "boolean"
          },
          "provenance_ref": {
            "description": "Opaque anchor for explicit provenance traversal, independent of display identifier length.",
            "pattern": "^prov_[0-9a-z]{12,80}$",
            "type": "string"
          },
          "review_reason": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/ReviewReasonCode"
              },
              {
                "type": "null"
              }
            ]
          },
          "title": {
            "description": "Safe, bounded control title.",
            "maxLength": 500,
            "minLength": 1,
            "type": "string"
          }
        },
        "required": [
          "control_id",
          "title",
          "classification",
          "decision_state",
          "has_positive_mapping",
          "review_reason"
        ],
        "type": "object"
      },
      "ControlPage": {
        "additionalProperties": false,
        "properties": {
          "page": {
            "additionalProperties": false,
            "properties": {
              "items": {
                "items": {
                  "$ref": "#/components/schemas/ControlInventoryItem"
                },
                "maxItems": 200,
                "minItems": 0,
                "type": "array"
              },
              "next_cursor": {
                "description": "Opaque cursor for the next page; null on the last page.",
                "oneOf": [
                  {
                    "maxLength": 512,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "total_matching": {
                "description": "Denominator for the current resource version and applied filters; with no filters it is the unfiltered total.",
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": [
              "items",
              "next_cursor",
              "total_matching"
            ],
            "type": "object"
          },
          "resource_version": {
            "$ref": "#/components/schemas/ResourceVersion"
          }
        },
        "required": [
          "resource_version",
          "page"
        ],
        "type": "object"
      },
      "ConversionRequest": {
        "additionalProperties": false,
        "properties": {
          "output_kind": {
            "description": "Which conversion pipeline to prepare.",
            "enum": [
              "oscal-catalog",
              "oscal-component-definition"
            ],
            "type": "string"
          },
          "source_resource_id": {
            "$ref": "#/components/schemas/ResourceId"
          },
          "target_path": {
            "$ref": "#/components/schemas/ProjectRelativePath"
          }
        },
        "required": [
          "source_resource_id",
          "output_kind",
          "target_path"
        ],
        "type": "object"
      },
      "ConversionResult": {
        "additionalProperties": false,
        "description": "Typed inspection of a succeeded conversion operation.",
        "properties": {
          "operation_id": {
            "$ref": "#/components/schemas/OperationId"
          },
          "preview": {
            "$ref": "#/components/schemas/EffectPreview"
          },
          "products": {
            "items": {
              "additionalProperties": false,
              "properties": {
                "kind": {
                  "enum": [
                    "oscal-catalog",
                    "oscal-component-definition"
                  ],
                  "type": "string"
                },
                "statement_count": {
                  "minimum": 0,
                  "type": "integer"
                }
              },
              "required": [
                "kind",
                "statement_count"
              ],
              "type": "object"
            },
            "maxItems": 2,
            "minItems": 1,
            "type": "array"
          },
          "validation": {
            "$ref": "#/components/schemas/ValidationReport"
          }
        },
        "required": [
          "operation_id",
          "products",
          "validation",
          "preview"
        ],
        "type": "object"
      },
      "DecisionState": {
        "description": "PRD 056 explicit human applicability states. Omitted controls have under-review semantics; the API never infers a state.",
        "enum": [
          "applicable",
          "not-applicable",
          "deferred",
          "under-review"
        ],
        "type": "string"
      },
      "DiagnosticSummary": {
        "additionalProperties": false,
        "properties": {
          "error_count": {
            "minimum": 0,
            "type": "integer"
          },
          "state": {
            "$ref": "#/components/schemas/ValidationState"
          },
          "warning_count": {
            "minimum": 0,
            "type": "integer"
          }
        },
        "required": [
          "state",
          "error_count",
          "warning_count"
        ],
        "type": "object"
      },
      "DraftPreviewResponse": {
        "additionalProperties": false,
        "description": "Shared response for synchronous preview-producing operations: validation of the complete proposed document plus the bound write preview. Nothing is committed.",
        "properties": {
          "preview": {
            "$ref": "#/components/schemas/EffectPreview"
          },
          "validation": {
            "$ref": "#/components/schemas/ValidationReport"
          }
        },
        "required": [
          "validation",
          "preview"
        ],
        "type": "object"
      },
      "DraftValidationRequest": {
        "additionalProperties": false,
        "properties": {
          "manifest": {
            "description": "Complete proposed forge.applicability/1 or forge.mapping-manifest/1 document.",
            "type": "object"
          }
        },
        "required": [
          "manifest"
        ],
        "type": "object"
      },
      "EffectPreview": {
        "additionalProperties": false,
        "description": "Everything a human confirms against: exact target, hashes, validation, semantic summary, escaped text diff, and the one-time receipt.",
        "properties": {
          "base_sha256": {
            "description": "Current target content hash; null when creating a new file.",
            "oneOf": [
              {
                "$ref": "#/components/schemas/Sha256Hex"
              },
              {
                "type": "null"
              }
            ]
          },
          "diff_text": {
            "description": "Escaped unified text diff of the exact proposed bytes.",
            "maxLength": 200000,
            "type": "string"
          },
          "diff_truncated": {
            "type": "boolean"
          },
          "exact_bytes_sha256": {
            "$ref": "#/components/schemas/Sha256Hex"
          },
          "input_hashes": {
            "items": {
              "additionalProperties": false,
              "properties": {
                "resource_id": {
                  "$ref": "#/components/schemas/ResourceId"
                },
                "sha256": {
                  "$ref": "#/components/schemas/Sha256Hex"
                }
              },
              "required": [
                "resource_id",
                "sha256"
              ],
              "type": "object"
            },
            "maxItems": 100,
            "minItems": 0,
            "type": "array"
          },
          "operation_type": {
            "enum": [
              "workspace-index-update",
              "resource-upload",
              "policy-conversion",
              "applicability-manifest-write",
              "mapping-manifest-write",
              "applicability-report-write",
              "mapping-report-write",
              "report-export"
            ],
            "type": "string"
          },
          "preview_id": {
            "$ref": "#/components/schemas/PreviewId"
          },
          "receipt": {
            "additionalProperties": false,
            "description": "One-time receipt bound to the session, operation type, destination identity, base hash, input hashes, and exact-byte hash.",
            "properties": {
              "expires_at": {
                "format": "date-time",
                "type": "string"
              },
              "token": {
                "maxLength": 512,
                "minLength": 16,
                "type": "string"
              }
            },
            "required": [
              "token",
              "expires_at"
            ],
            "type": "object"
          },
          "semantic_summary": {
            "description": "Safe, escaped summary of the semantic change.",
            "maxLength": 4000,
            "type": "string"
          },
          "target": {
            "additionalProperties": false,
            "properties": {
              "path": {
                "$ref": "#/components/schemas/ProjectRelativePath"
              },
              "status": {
                "enum": [
                  "create",
                  "overwrite"
                ],
                "type": "string"
              }
            },
            "required": [
              "path",
              "status"
            ],
            "type": "object"
          },
          "target_version": {
            "description": "Current version of the target resource when overwriting.",
            "oneOf": [
              {
                "$ref": "#/components/schemas/ResourceVersion"
              },
              {
                "type": "null"
              }
            ]
          },
          "validation": {
            "$ref": "#/components/schemas/ValidationReport"
          }
        },
        "required": [
          "preview_id",
          "operation_type",
          "target",
          "base_sha256",
          "exact_bytes_sha256",
          "input_hashes",
          "validation",
          "semantic_summary",
          "diff_text",
          "diff_truncated",
          "receipt"
        ],
        "type": "object"
      },
      "Error": {
        "additionalProperties": false,
        "description": "Closed safe error envelope for the advertised contract revision. Existing code meanings are preserved. API2.1 adds typed cooperative read interruption errors; no capability, absolute path, source excerpt or debug text is retained.",
        "examples": [
          {
            "code": "version-conflict",
            "correlation_id": "corr_1f2e3d4c5b6a",
            "message": "The resource changed since it was read. Reload and retry.",
            "resource": "res_0f1e2d3c4b5a69788796a5b4",
            "resource_version": "aa99887766554433",
            "retryable": true
          }
        ],
        "properties": {
          "code": {
            "enum": [
              "invalid-request",
              "unauthorized",
              "unlock-failed",
              "unlock-throttled",
              "read-only-session",
              "not-found",
              "unsupported-media-type",
              "payload-too-large",
              "resource-containment",
              "version-conflict",
              "idempotency-key-conflict",
              "receipt-expired",
              "receipt-reused",
              "receipt-mismatch",
              "validation-failed",
              "operation-not-cancellable",
              "shutdown-in-progress",
              "internal-error",
              "query-budget-exceeded",
              "query-interrupted"
            ],
            "type": "string"
          },
          "correlation_id": {
            "maxLength": 128,
            "minLength": 8,
            "type": "string"
          },
          "field": {
            "description": "Optional JSON pointer into the request document.",
            "maxLength": 256,
            "minLength": 1,
            "type": "string"
          },
          "message": {
            "description": "Safe, human-readable message with no sensitive content.",
            "maxLength": 500,
            "minLength": 1,
            "type": "string"
          },
          "resource": {
            "description": "Optional opaque resource or operation identifier the error concerns.",
            "maxLength": 128,
            "minLength": 3,
            "type": "string"
          },
          "resource_version": {
            "$ref": "#/components/schemas/ResourceVersion"
          },
          "retryable": {
            "description": "Whether an identical retry can succeed later.",
            "type": "boolean"
          }
        },
        "required": [
          "code",
          "message",
          "retryable"
        ],
        "type": "object"
      },
      "ExportRequest": {
        "additionalProperties": false,
        "properties": {
          "format": {
            "default": "static-html",
            "enum": [
              "static-html"
            ],
            "type": "string"
          },
          "redaction_profile": {
            "default": "strict-default",
            "description": "Only the strict default redaction profile exists in v1.",
            "enum": [
              "strict-default"
            ],
            "type": "string"
          },
          "report_kind": {
            "enum": [
              "applicability-gap",
              "mapping-collection",
              "trace"
            ],
            "type": "string"
          },
          "target_path": {
            "$ref": "#/components/schemas/ProjectRelativePath"
          }
        },
        "required": [
          "report_kind",
          "target_path"
        ],
        "type": "object"
      },
      "ExportResult": {
        "additionalProperties": false,
        "description": "Typed terminal result of a succeeded export operation.",
        "properties": {
          "operation_id": {
            "$ref": "#/components/schemas/OperationId"
          },
          "preview": {
            "$ref": "#/components/schemas/EffectPreview"
          },
          "redaction_summary": {
            "additionalProperties": false,
            "properties": {
              "removed_categories": {
                "items": {
                  "enum": [
                    "reviewer-names",
                    "absolute-paths",
                    "source-excerpts",
                    "secrets"
                  ],
                  "type": "string"
                },
                "maxItems": 8,
                "minItems": 0,
                "type": "array"
              }
            },
            "required": [
              "removed_categories"
            ],
            "type": "object"
          }
        },
        "required": [
          "operation_id",
          "preview",
          "redaction_summary"
        ],
        "type": "object"
      },
      "GapClassification": {
        "description": "PRD 056 gap classifications; participation terminology only, never a compliance claim.",
        "enum": [
          "applicable-mapped",
          "applicable-reviewed-no-relationship",
          "applicable-unmapped",
          "not-applicable",
          "deferred",
          "under-review"
        ],
        "type": "string"
      },
      "MappingBuildResult": {
        "additionalProperties": false,
        "description": "Typed terminal result of a succeeded mapping-build operation.",
        "properties": {
